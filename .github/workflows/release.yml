name: Release

on:
  push:
    branches: [main]

# No id-token. @semantic-release/npm v13 treats an available OIDC token as a
# signal to publish through npm trusted publishing, and tries that before the
# NPM_TOKEN. Neither package is configured for trusted publishing on npmjs.com,
# so the exchange 404s and the run has been dying there since May 2026 —
# `trusta` is still on 0.9.0 and @trusta/react has never been published at all.
#
# Withholding the permission makes the token the only path, which is what this
# repository actually uses. Restore it once trusted publishing is configured for
# both packages, which needs them to exist on the registry first.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Released one package at a time, in dependency order. Each reads its own
      # .releaserc.json, and semantic-release-monorepo narrows the commit range
      # to commits that touched that package — so a CLI fix cannot bump the
      # version of a package sitting in someone else's bundle.
      - name: Release trusta
        working-directory: packages/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Release @trusta/react
        working-directory: packages/react
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
